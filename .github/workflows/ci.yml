name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download official EIA STEO vintage samples
        run: |
          mkdir -p /tmp/steo-vintages
          curl --fail --location --retry 3 https://www.eia.gov/outlooks/steo/archives/jan26_base.xlsx -o /tmp/steo-vintages/jan26_base.xlsx
          curl --fail --location --retry 3 https://www.eia.gov/outlooks/steo/archives/jul26_base.xlsx -o /tmp/steo-vintages/jul26_base.xlsx
          curl --fail --location --retry 3 https://www.eia.gov/outlooks/steo/archives/aug26_base.xlsx -o /tmp/steo-vintages/aug26_base.xlsx
      - name: Preserve official STEO vintage samples for format inspection
        uses: actions/upload-artifact@v4
        with:
          name: steo-official-vintage-samples
          path: /tmp/steo-vintages/*.xlsx
          if-no-files-found: error
          retention-days: 1
      - name: Physical-data contract tests
        run: npm run test:physical
      - name: Provider-adapter contract tests
        run: npm run test:provider
      - name: Provider-trial evaluator tests
        run: npm run test:trial
      - name: Landed-cost engine tests
        run: npm run test:landed
      - name: Scenario-lab adapter tests
        run: npm run test:scenario
      - name: STEO revision tracking tests
        run: npm run test:steo-revision
      - name: STEO snapshot archive tests
        run: npm run test:steo-archive
      - name: STEO vintage backtest tests
        run: npm run test:steo-backtest
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
