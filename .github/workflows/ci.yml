name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Physical-data contract tests
        run: npm run test:physical
      - name: Provider-adapter contract tests
        run: npm run test:provider
      - name: Provider-trial evaluator tests
        run: npm run test:trial
      - name: Public market snapshot tests
        run: npm run test:market-snapshot
      - name: Public evidence manifest tests
        run: npm run test:evidence-manifest
      - name: Public market archive tests
        run: npm run test:public-archive
      - name: Public source-state comparison tests
        run: npm run test:public-history
      - name: Public source-state watch tests
        run: npm run test:public-watch
      - name: Public EIA brief tests
        run: npm run test:public-brief
      - name: Landed-cost engine tests
        run: npm run test:landed
      - name: Scenario-lab adapter tests
        run: npm run test:scenario
      - name: STEO revision tracking tests
        run: npm run test:steo-revision
      - name: STEO snapshot archive tests
        run: npm run test:steo-archive
      - name: STEO vintage backtest tests
        run: npm run test:steo-backtest
      - name: Official STEO vintage tests
        run: npm run test:steo-official
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify private-demo port contract
        run: |
          grep -F '127.0.0.1:3000:3000' docker-compose.yml
          if grep -F '"3000:3000"' docker-compose.yml; then
            echo 'Direct all-interface port publication is not allowed for the default demo compose.'
            exit 1
          fi
      - name: Build production container
        run: docker build -t lastbarrel-ci:${{ github.sha }} .
      - name: Start production container
        run: docker run -d --name lastbarrel-ci -p 127.0.0.1:3000:3000 lastbarrel-ci:${{ github.sha }}
      - name: Verify dependency-independent health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health -o /tmp/health.json; then
              node -e "const p=require('/tmp/health.json'); if(p.status!=='ok'||p.app!=='LastBarrel') process.exit(1); console.log(p)"
              exit 0
            fi
            sleep 2
          done
          docker logs lastbarrel-ci
          exit 1
      - name: Verify visible production routes
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/home.html
          grep -F 'Oil market overview' /tmp/home.html
          grep -F 'Physical providers not connected' /tmp/home.html
          grep -F 'PUBLIC-DATA SNAPSHOT' /tmp/home.html
          grep -F 'No bullish/bearish score and no causal interpretation.' /tmp/home.html
          grep -F 'STEO Revisions' /tmp/home.html
          grep -F 'Download public brief' /tmp/home.html
          grep -F 'href="/api/brief"' /tmp/home.html
          grep -F 'Open Scenario Lab' /tmp/home.html
          grep -F 'Open revision history' /tmp/home.html
          if grep -F 'Export brief' /tmp/home.html || grep -F '+ Create alert' /tmp/home.html; then
            echo 'Overview must not advertise unimplemented actions.'
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/api/steo/revisions -o /tmp/revisions.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/revisions.json', 'utf8'));
          if (payload.status !== 'available') throw new Error(`Expected available revision intelligence, got ${payload.status}: ${payload.error ?? ''}`);
          if (payload.data?.archive?.vintageCount !== 8) throw new Error(`Expected 8 packaged official vintages, got ${payload.data?.archive?.vintageCount}`);
          NODE
          curl --fail --silent --show-error http://127.0.0.1:3000/api/public/history -o /tmp/public-history.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/public-history.json', 'utf8'));
          if (payload.status !== 'available') throw new Error(`Expected available public history endpoint, got ${payload.status}: ${payload.error ?? ''}`);
          const states = payload.data?.archive?.sourceStates;
          if (!Number.isInteger(states) || states < 1) throw new Error(`Expected at least one packaged public source state, got ${states}`);
          if (!Array.isArray(payload.data?.archive?.fingerprints) || payload.data.archive.fingerprints.length !== states) throw new Error('Public history fingerprint count does not match source-state count');
          if (states === 1) {
            if (payload.data?.comparisonStatus !== 'insufficient-history' || payload.data?.comparison !== null) throw new Error('Single-state archive must not manufacture a comparison');
          } else {
            if (payload.data?.comparisonStatus !== 'available') throw new Error('Multi-state archive did not expose an available comparison');
            if (payload.data?.comparison?.method !== 'lastbarrel-public-source-state-comparison-v1') throw new Error('Unexpected public history comparison method');
          }
          NODE
          curl --fail --silent --show-error http://127.0.0.1:3000/revisions -o /tmp/revisions.html
          grep -F 'What changed between STEO releases?' /tmp/revisions.html
          grep -F 'not explanations of market causality' /tmp/revisions.html
          curl --fail --silent --show-error http://127.0.0.1:3000/scenarios -o /tmp/scenarios.html
          grep -F 'Landed cost scenario lab' /tmp/scenarios.html
          grep -F 'NOT LIVE PHYSICAL DATA' /tmp/scenarios.html
      - name: Show container logs on failure
        if: failure()
        run: docker logs lastbarrel-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f lastbarrel-ci || true
