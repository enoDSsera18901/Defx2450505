name: Live EIA smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/lastbarrel.log 2>&1 &
          echo $! > /tmp/lastbarrel.pid
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/market -o /tmp/market.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lastbarrel.log
          exit 1
      - name: Verify live EIA, derived snapshot and STEO payload
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/market.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          const close = (a, b) => Math.abs(a - b) < 1e-6;
          if (payload.status !== 'live') fail(`Expected live core EIA status, got ${payload.status}`);
          const data = payload.data;
          if (!Array.isArray(data?.prices?.brent) || data.prices.brent.length < 2) fail('Brent EIA series missing');
          if (!Array.isArray(data?.prices?.wti) || data.prices.wti.length < 2) fail('WTI EIA series missing');
          if (!Array.isArray(data?.inventories) || data.inventories.length < 2) fail('EIA inventory series missing');
          const balance = data?.globalBalance;
          if (!balance) fail(`STEO balance missing: ${data?.globalBalanceError ?? 'unknown error'}`);
          if (balance?.seriesIds?.supply !== 'PAPR_WORLD') fail('Unexpected STEO supply series');
          if (balance?.seriesIds?.demand !== 'PATC_WORLD') fail('Unexpected STEO demand series');
          if (!/^[a-f0-9]{64}$/.test(balance?.revisionFingerprint ?? '')) fail('STEO revision fingerprint missing or malformed');
          if (!Array.isArray(balance?.forecast) || balance.forecast.length < 2) fail('Paired STEO forecast periods missing');
          for (const point of balance.forecast.slice(0, 2)) {
            if (point.classification !== 'forecast') fail('STEO point not labelled forecast');
            if (!Number.isFinite(point.supplyMbpd) || !Number.isFinite(point.demandMbpd) || !Number.isFinite(point.balanceMbpd)) fail('Invalid STEO numeric point');
          }

          const snapshot = data?.publicSnapshot;
          if (snapshot?.method !== 'eia-public-derived-snapshot-v1') fail('Public market snapshot method missing or unexpected');
          const spread = snapshot.brentWtiSpread;
          if (!spread) fail('Live public snapshot did not produce a same-period Brent-WTI spread');
          const brentPoint = data.prices.brent.find((point) => point.period === spread.period);
          const wtiPoint = data.prices.wti.find((point) => point.period === spread.period);
          if (!brentPoint || !wtiPoint) fail('Snapshot spread period does not exist in both live price series');
          if (!close(spread.spreadUsdBbl, brentPoint.value - wtiPoint.value)) fail('Snapshot Brent-WTI arithmetic does not reconcile to live source values');
          if (spread.classification !== 'derived-public-price-observation') fail('Snapshot spread evidence classification is wrong');

          const inventoryChange = snapshot.inventoryChange;
          if (!inventoryChange) fail('Live public snapshot did not produce an inventory change');
          const distinctInventories = [...new Map(data.inventories.map((point) => [point.period, point])).values()].sort((a, b) => b.period.localeCompare(a.period));
          if (inventoryChange.latestPeriod !== distinctInventories[0]?.period || inventoryChange.previousPeriod !== distinctInventories[1]?.period) fail('Snapshot inventory periods do not match the two latest distinct live observations');
          if (!close(inventoryChange.deltaThousandBarrels, distinctInventories[0].value - distinctInventories[1].value)) fail('Snapshot inventory arithmetic does not reconcile to live source values');
          if (inventoryChange.classification !== 'derived-public-inventory-observation') fail('Snapshot inventory evidence classification is wrong');

          const nearTermSnapshot = snapshot.nearTermBalance;
          const earliestForecast = [...balance.forecast].sort((a, b) => a.period.localeCompare(b.period))[0];
          if (!nearTermSnapshot || nearTermSnapshot.period !== earliestForecast.period) fail('Snapshot near-term balance does not match earliest live STEO forecast period');
          if (nearTermSnapshot.classification !== 'forecast') fail('Snapshot near-term balance lost forecast classification');
          if (!Array.isArray(snapshot.limitations) || !snapshot.limitations.some((item) => item.includes('bullish/bearish score'))) fail('Snapshot descriptive/no-score limitation missing');

          console.log(JSON.stringify({
            coreStatus: payload.status,
            brentLatest: data.prices.brent[0].period,
            inventoryLatest: data.inventories[0].period,
            publicSnapshot: snapshot,
            steoFirstForecast: balance.forecast[0],
            steoSeries: balance.seriesIds,
            steoRevisionFingerprint: balance.revisionFingerprint,
          }, null, 2));
          NODE
      - name: Verify committed Jan-Aug official STEO archive and backtest
        run: |
          npx tsx scripts/import-steo-official-vintages.ts 2026 data/steo-official-vintages > /tmp/steo-official-import.json
          npx tsx scripts/backtest-steo-official-vintages.ts 2026-01 2026-08 data/steo-official-vintages > /tmp/steo-official-backtest.json
          node <<'NODE'
          const fs = require('node:fs');
          const fail = (message) => { throw new Error(message); };
          const imported = JSON.parse(fs.readFileSync('/tmp/steo-official-import.json', 'utf8'));
          const backtest = JSON.parse(fs.readFileSync('/tmp/steo-official-backtest.json', 'utf8'));
          if (!Array.isArray(imported.vintages) || imported.vintages.length !== 8) fail(`Expected eight Jan-Aug 2026 official vintages, got ${imported.vintages?.length}`);
          if (new Set(imported.vintages.map((v) => v.sourceArtifactSha256)).size !== 8) fail('Official STEO source artifacts are not uniquely identified by SHA-256');
          const unexpectedStatus = imported.vintages.find((v) => v.status !== 'source-artifact-already-present-and-normalization-verified');
          if (unexpectedStatus) fail(`Committed official STEO archive no longer matches live EIA/source normalization for ${unexpectedStatus.issue}: ${unexpectedStatus.status}`);
          if (backtest.baseline?.issue !== '2026-01' || backtest.reference?.issue !== '2026-08') fail('Official STEO backtest selected the wrong endpoint vintages');
          if (!Array.isArray(backtest.laterEstimateComparisons) || backtest.laterEstimateComparisons.length < 1) fail('Official STEO backtest produced no matured-period comparisons');
          if (!Array.isArray(backtest.continuingForecastComparisons) || backtest.continuingForecastComparisons.length < 1) fail('Official STEO backtest produced no continuing forecast revisions');
          if (!backtest.metrics || backtest.metrics.comparedPeriods < 1) fail('Official STEO backtest metrics missing');
          console.log(JSON.stringify({
            verifiedIssues: imported.vintages.map((v) => v.issue),
            baseline: backtest.baseline,
            reference: backtest.reference,
            maturedPeriods: backtest.laterEstimateComparisons.length,
            continuingForecastPeriods: backtest.continuingForecastComparisons.length,
            metrics: backtest.metrics,
            evidenceBoundary: backtest.evidenceBoundary,
          }, null, 2));
          NODE
      - name: Verify public EIA brief download
        run: |
          curl --fail --silent --show-error -D /tmp/public-brief.headers http://127.0.0.1:3000/api/brief -o /tmp/public-brief.md
          grep -iF 'content-type: text/markdown' /tmp/public-brief.headers
          grep -Ei 'content-disposition: attachment; filename="lastbarrel-public-eia-brief-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md"' /tmp/public-brief.headers
          grep -F '# LastBarrel Public EIA Evidence Brief' /tmp/public-brief.md
          grep -F 'Scope: public EIA observations, EIA STEO forecasts, and preserved official STEO revision evidence only.' /tmp/public-brief.md
          grep -F '8 official vintages, 2026-01 → 2026-08' /tmp/public-brief.md
          grep -F 'Live cargo identity, volumes, destination/ETA, commitments and freight remain unavailable' /tmp/public-brief.md
          grep -F 'No bullish/bearish score, trade recommendation, or physical-availability claim is produced by this brief.' /tmp/public-brief.md
      - name: Verify archive checkout stayed clean
        run: git diff --exit-code -- data/steo-official-vintages
      - name: Verify STEO revision intelligence API and page
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/steo/revisions -o /tmp/steo-revisions.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/steo-revisions.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (payload.status !== 'available') fail(`Expected available revision intelligence, got ${payload.status}: ${payload.error ?? ''}`);
          const data = payload.data;
          if (data?.archive?.vintageCount !== 8) fail(`Expected 8 official vintages, got ${data?.archive?.vintageCount}`);
          if (data?.archive?.firstIssue !== '2026-01' || data?.archive?.latestIssue !== '2026-08') fail('Unexpected revision archive endpoints');
          if (data?.latestRevision?.baselineIssue !== '2026-07' || data?.latestRevision?.referenceIssue !== '2026-08') fail('Latest revision window is not Jul→Aug 2026');
          if (!Array.isArray(data?.latestRevision?.largestForecastBalanceRevisions)) fail('Latest forecast revision ranking missing');
          if (!Array.isArray(data?.archiveSpan?.largestLaterEstimateBalanceDifferences)) fail('Archive-span later-estimate ranking missing');
          if (!Array.isArray(data?.limitations) || !data.limitations.some((item) => item.includes('public estimates'))) fail('Public-estimate limitation missing');
          NODE
          curl --fail --silent --show-error http://127.0.0.1:3000/revisions -o /tmp/revisions.html
          grep -F "What changed between STEO releases?" /tmp/revisions.html
          grep -F "LATEST RELEASE CHANGE" /tmp/revisions.html
          grep -F "ARCHIVE-SPAN CHANGE" /tmp/revisions.html
          grep -F "not explanations of market causality" /tmp/revisions.html
      - name: Verify scenario lab production route and analysis bundle
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/scenarios -o /tmp/scenarios.html
          grep -F "Landed cost scenario lab" /tmp/scenarios.html
          grep -F "NOT LIVE PHYSICAL DATA" /tmp/scenarios.html
          grep -F "No default freight, fees or insurance values are preloaded" /tmp/scenarios.html
          scenario_chunk=$(grep -o '/_next/static/chunks/app/scenarios/page-[^" ]*\.js' /tmp/scenarios.html | head -n 1)
          test -n "$scenario_chunk"
          curl --fail --silent --show-error "http://127.0.0.1:3000${scenario_chunk}" -o /tmp/scenario-page.js
          grep -F "One-at-a-time sensitivity" /tmp/scenario-page.js
          grep -F "Why this total exists" /tmp/scenario-page.js
          grep -F "Scenario Lab analyst stress" /tmp/scenario-page.js
          grep -F "Pin current as baseline" /tmp/scenario-page.js
          grep -F "Current versus pinned baseline" /tmp/scenario-page.js
          grep -F "Lost on refresh; not a historical market observation." /tmp/scenario-page.js
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/lastbarrel.log || true
